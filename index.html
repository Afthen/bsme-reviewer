<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Machine Design Reviewer & Graph Solver</title>
  
  <!-- Math & Symbolic Dependencies -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <!-- Client-Side Computer Algebra System (Nerdamer CAS) -->
  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/nerdamer.core.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Algebra.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Calculus.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Solve.js"></script>

  <style>
    :root {
      --bg: #141517;
      --panel: #1a1b1e;
      --card: #202124;
      --border: #2e3035;
      --border-subtle: #25262a;
      --text: #e4e5e7;
      --text-muted: #909296;
      --text-dim: #606266;
      --accent-math: #93c5fd;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --font-base: 0.95rem;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      min-height: 100dvh;
      overflow: hidden;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      gap: 0.75rem;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .header-actions { display: flex; gap: 0.4rem; align-items: center; }
    .btn {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.35rem 0.65rem;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn:hover { background: var(--border); color: #fff; }
    
    .select-topic {
      background: var(--card);
      color: #fff;
      border: 1px solid var(--border);
      padding: 0.35rem 0.65rem;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }
    .select-topic:focus { border-color: var(--accent-math); }

    .workspace {
      display: block;
      flex: 1;
      overflow-y: auto;
      position: relative;
    }

    aside {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 320px;
      max-width: 85vw;
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 1.25rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      overflow-y: auto;
      z-index: 1001;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      box-shadow: 4px 0 24px rgba(0, 0, 0, 0.5);
    }
    aside.open { transform: translateX(0); }

    #sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(2px);
      z-index: 1000;
      display: none;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    #sidebar-overlay.active {
      display: block;
      opacity: 1;
    }

    .sidebar-section { display: flex; flex-direction: column; gap: 0.5rem; }
    .sidebar-title { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; color: var(--text-dim); }
    .weight-bars { display: flex; flex-direction: column; gap: 0.35rem; font-size: 0.72rem; color: var(--text-muted); }
    .weight-row { display: flex; flex-direction: column; gap: 0.2rem; }
    .weight-label-bar { display: flex; justify-content: space-between; gap: 0.5rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; align-items: center; }
    
    main {
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      padding: 2.25rem 1.5rem 3rem;
      flex: 1;
    }
    .panel-view { display: none; }
    .panel-view.active { display: block; }
    .article-container { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.75rem; }
    
    .problem-header h2 { font-size: 1.35rem; font-weight: 600; margin-bottom: 0.75rem; color: #fff; }
    
    .problem-statement,
    .solution-text,
    .solution-summary {
      font-size: var(--font-base);
      color: #d1d2d5;
      line-height: 1.7;
    }

    .math-token {
      display: inline-block;
      white-space: nowrap;
    }

    .katex {
      font-size: 1.15em !important;
      text-rendering: auto;
    }
    .katex-display {
      font-size: 1.2em !important;
      margin: 0.85rem 0 !important;
    }
    
    .solution-section { border-top: 1px solid var(--border); padding-top: 1.5rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .solution-top { display: flex; justify-content: space-between; align-items: center; min-height: 24px; }
    .solution-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; color: var(--text-dim); }
    .solution-toggle-all { font-size: 0.75rem; color: var(--text-muted); cursor: pointer; background: none; border: none; display: flex; }
    .solution-toggle-all:hover { color: var(--text); }
    
    .solution-item { border: 1px solid var(--border-subtle); border-radius: 4px; background: var(--panel); overflow: hidden; }
    .solution-summary {
      padding: 0.6rem 0.9rem;
      cursor: pointer;
      font-weight: 500;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
      gap: 1rem;
    }
    .solution-summary:hover { background: var(--card); }
    .step-label-wrap { display: flex; align-items: center; gap: 0.6rem; flex: 1; }
    .chevron { font-size: 0.75rem; color: var(--text-dim); transition: transform 0.2s ease; }
    .solution-item.open .chevron { transform: rotate(90deg); color: var(--text); }
    
    .step-input-wrap { display: flex; align-items: center; padding: 2px; }
    .step-ans-input {
      background: #141517;
      border: 1.5px solid var(--border);
      color: #fff;
      font-size: var(--font-base);
      font-weight: 500;
      padding: 0.35rem 0.8rem;
      border-radius: 5px;
      width: 140px;
      outline: none;
      transition: all 0.15s;
      text-align: right;
      -webkit-appearance: none !important;
      -moz-appearance: textfield !important;
      appearance: textfield !important;
    }
    .step-ans-input::-webkit-outer-spin-button,
    .step-ans-input::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none !important;
      display: none !important;
      margin: 0 !important;
    }

    .step-ans-input:focus { border-color: var(--accent-math); }
    .step-ans-input.state-correct {
      border-color: var(--success) !important;
      color: var(--success) !important;
      background: rgba(34, 197, 94, 0.05);
    }
    .step-ans-input.state-wrong {
      border-color: var(--danger) !important;
      color: var(--danger) !important;
      background: rgba(239, 68, 68, 0.05);
    }
    .step-ans-input.state-revealed {
      border-color: var(--border) !important;
      color: var(--text-dim) !important;
      font-style: italic;
    }

    .shake-trigger { animation: shake 0.35s ease; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }

    .solution-body {
      padding: 0.85rem 1rem 1rem;
      border-top: 1px solid var(--border-subtle);
      display: none;
      flex-direction: column;
      gap: 0.6rem;
      background: #17181a;
    }
    .solution-item.open .solution-body { display: flex; }
    .solution-math-display {
      padding: 0.75rem 1rem;
      background: var(--bg);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      overflow-x: auto;
      text-align: left;
    }
    
    .distractor-banner {
      background: rgba(16, 185, 129, 0.07);
      border: 1px solid rgba(16, 185, 129, 0.28);
      border-radius: 6px;
      padding: 0.85rem 1.1rem;
      font-size: 0.85rem;
      color: #a7f3d0;
      line-height: 1.5;
      display: none;
      margin-top: 0.5rem;
    }

    .problem-footer-actions {
      display: flex;
      justify-content: flex-end;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      margin-top: 0.5rem;
    }
    .btn-generate-next {
      background: #25272c;
      border: 1px solid #3b3e45;
      padding: 0.5rem 1.1rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-generate-next:hover { background: #33363d; border-color: #4b505a; }

    .interactive-var {
      display: inline-block;
      cursor: pointer;
      border-bottom: 1px dotted var(--text-dim);
      padding: 0 1px;
    }
    .interactive-var:hover {
      color: var(--accent-math) !important;
      border-bottom: 1px solid var(--accent-math);
    }

    #tooltip {
      position: fixed;
      background: #1e1f23;
      border: 1px solid #373a40;
      border-radius: 4px;
      padding: 0.5rem 0.75rem;
      font-size: 0.75rem;
      max-width: 320px;
      z-index: 1000;
      pointer-events: none;
      display: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    #tooltip .tt-name { font-weight: 600; color: #fff; margin-bottom: 0.2rem; }
    #tooltip .tt-math { margin: 0.25rem 0; color: var(--accent-math); }
    #tooltip .tt-hint { font-size: 0.68rem; color: var(--text-dim); }

    /* Flashcard Carousel Modal & Interactive Variable Pills */
    .carousel-container { max-width: 520px; margin: 1.5rem auto; display: flex; flex-direction: column; gap: 1rem; }
    .carousel-top-bar { display: flex; justify-content: space-between; align-items: center; }
    .carousel-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; display: flex; flex-direction: column; min-height: 320px; }
    .carousel-card-header { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border-subtle); display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-dim); }
    .carousel-card-body { flex: 1; padding: 2rem 1.5rem; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 1.25rem; }
    .carousel-formula { font-size: 1.35rem; padding: 0.75rem 1.25rem; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; width: 100%; overflow-x: auto; }
    .carousel-notes { font-size: 0.85rem; color: var(--text-muted); }
    
    .carousel-rearrange-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
      color: var(--text-dim);
    }
    .var-pills-wrap {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .var-pill {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.25rem 0.65rem;
      border-radius: 4px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
    }
    .var-pill:hover { border-color: var(--accent-math); color: #fff; }
    .var-pill.active {
      background: rgba(147, 197, 253, 0.15);
      border-color: var(--accent-math);
      color: var(--accent-math);
      font-weight: 600;
    }

    .carousel-footer { padding: 0.75rem 1rem; border-top: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; }
    .carousel-nav-btn { background: transparent; border: 1px solid var(--border); color: var(--text); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; }
    .carousel-dots { display: flex; gap: 0.3rem; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); }
    .dot.active { background: #fff; width: 14px; border-radius: 3px; }

    @media (max-width: 768px) {
      body { height: 100dvh; overflow-y: auto; }
      header { padding: 0.5rem 0.75rem; flex-direction: column; gap: 0.5rem; align-items: stretch; }
      .header-actions { justify-content: center; flex-wrap: wrap; gap: 0.35rem; }
      main { padding: 1.25rem 0.75rem 3rem; }
      .step-ans-input { width: 120px; font-size: 16px; padding: 0.4rem 0.6rem; }
      .solution-summary { padding: 0.6rem 0.75rem; gap: 0.5rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <button class="btn" id="btn-hamburger">☰ Mastery</button>
      <select id="topic-selector" class="select-topic">
        <option value="spur_gears">Spur Gears</option>
        <option value="helical_gears">Helical Gears</option>
      </select>
    </div>
    <div class="header-actions">
      <button class="btn" id="btn-export">💾 Export</button>
      <button class="btn" id="btn-import">📥 Import</button>
      <input type="file" id="mastery-file-input" style="display: none" accept=".json">
    </div>
  </header>

  <div id="sidebar-overlay"></div>

  <div class="workspace">
    <aside id="sidebar-drawer">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span class="sidebar-title">Formula Mastery (Harmonic)</span>
        <button class="btn" id="btn-close-sidebar" style="padding: 0.2rem 0.5rem;">✕</button>
      </div>
      <div class="sidebar-section">
        <div class="weight-bars" id="weight-bars-el"></div>
      </div>
    </aside>

    <main>
      <section id="view-problem" class="panel-view active">
        <div class="article-container">
          <div class="problem-header">
            <h2 id="p-title"></h2>
            <div id="p-statement" class="problem-statement"></div>
          </div>

          <div class="solution-section">
            <div class="solution-top">
              <span class="solution-title">Solution Steps (Type Answer & Enter)</span>
              <button class="solution-toggle-all" id="btn-toggle-all">Expand / Collapse All</button>
            </div>
            <div id="p-solution-flow" style="display: flex; flex-direction: column; gap: 0.5rem;"></div>
          </div>

          <div id="distractor-banner" class="distractor-banner"></div>

          <div class="problem-footer-actions">
            <button class="btn-generate-next" id="btn-generate-next">⚡ Generate Next Problem</button>
          </div>
        </div>
      </section>

      <section id="view-carousel" class="panel-view">
        <div class="carousel-container">
          <div class="carousel-top-bar">
            <button class="btn" id="btn-back-to-problem">← Back to Problem</button>
            <span id="c-var-title" style="font-size: 0.9rem; font-weight: 500;"></span>
          </div>

          <div class="carousel-card">
            <div class="carousel-card-header">
              <span id="c-counter">1 / 1</span>
              <span id="c-dimension" style="font-weight: 600; color: var(--accent-math);"></span>
            </div>

            <div class="carousel-card-body">
              <div id="c-formula" class="carousel-formula"></div>
              <p id="c-notes" class="carousel-notes"></p>

              <div class="carousel-rearrange-bar">
                <span>Isolate Variable:</span>
                <div id="c-vars-container" class="var-pills-wrap"></div>
              </div>
            </div>

            <div class="carousel-footer">
              <button class="carousel-nav-btn" id="c-prev">‹</button>
              <div class="carousel-dots" id="c-dots"></div>
              <button class="carousel-nav-btn" id="c-next">›</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="tooltip"></div>

  <!-- NATIVE ES MODULE ENTRY POINT -->
  <script type="module" src="app.js"></script>
</body>
</html>
