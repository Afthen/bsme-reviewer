<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spur Gear Reviewer & Graph Solver</title>
  
  <!-- Math & Symbolic Dependencies (KaTeX) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <!-- Client-Side Computer Algebra System (Nerdamer CAS) -->
  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/nerdamer.core.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Algebra.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Calculus.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Solve.js"></script>

  <style>
    :root {
      --bg: #141517;
      --panel: #1a1b1e;
      --card: #202124;
      --border: #2e3035;
      --border-subtle: #25262a;
      --text: #e4e5e7;
      --text-muted: #909296;
      --text-dim: #606266;
      --accent-math: #93c5fd;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      min-height: 100dvh;
      overflow: hidden;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    header h1 { font-size: 0.95rem; font-weight: 600; color: var(--text); }
    .header-actions { display: flex; gap: 0.5rem; align-items: center; }
    .btn {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.35rem 0.75rem;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn:hover { background: var(--border); color: #fff; }
    
    .workspace {
      display: grid;
      grid-template-columns: 280px 1fr;
      flex: 1;
      overflow: hidden;
    }
    aside {
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 1.25rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      overflow-y: auto;
    }
    .sidebar-section { display: flex; flex-direction: column; gap: 0.5rem; }
    .sidebar-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; color: var(--text-dim); }
    .weight-bars { display: flex; flex-direction: column; gap: 0.35rem; font-size: 0.72rem; color: var(--text-muted); }
    .weight-row { display: flex; flex-direction: column; gap: 0.2rem; }
    .weight-label-bar { display: flex; justify-content: space-between; gap: 0.5rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; align-items: center; }
    
    /* CENTERED MAIN COLUMN */
    main { padding: 2.5rem 3rem; overflow-y: auto; background: var(--bg); flex: 1; }
    .panel-view { display: none; }
    .panel-view.active { display: block; }
    .article-container { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.75rem; }
    
    .problem-header h2 { font-size: 1.35rem; font-weight: 600; margin-bottom: 0.75rem; color: #fff; }
    .problem-statement { font-size: 1rem; color: #d1d2d5; line-height: 1.7; }
    
    .solution-section { border-top: 1px solid var(--border); padding-top: 1.5rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .solution-top { display: flex; justify-content: space-between; align-items: center; min-height: 24px; }
    .solution-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; color: var(--text-dim); }
    .solution-toggle-all { font-size: 0.75rem; color: var(--text-muted); cursor: pointer; background: none; border: none; display: none; }
    .solution-toggle-all:hover { color: var(--text); }
    
    .solution-item { border: 1px solid var(--border-subtle); border-radius: 4px; background: var(--panel); overflow: hidden; }
    .solution-summary {
      padding: 0.6rem 0.9rem;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
      gap: 1rem;
    }
    .solution-summary:hover { background: var(--card); }
    .step-label-wrap { display: flex; align-items: center; gap: 0.6rem; flex: 1; }
    .chevron { font-size: 0.75rem; color: var(--text-dim); transition: transform 0.2s ease; }
    .solution-item.open .chevron { transform: rotate(90deg); color: var(--text); }
    
    /* INPUT BOX */
    .step-input-wrap { display: flex; align-items: center; padding: 2px; }
    .step-ans-input {
      background: #141517;
      border: 1.5px solid var(--border);
      color: #fff;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0.35rem 0.8rem;
      border-radius: 5px;
      width: 140px;
      outline: none;
      transition: all 0.15s;
      text-align: right;
      -webkit-appearance: none;
      appearance: none;
    }
    .step-ans-input::-webkit-outer-spin-button,
    .step-ans-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .step-ans-input:focus { border-color: var(--accent-math); }
    .step-ans-input.state-correct {
      border-color: var(--success) !important;
      color: var(--success) !important;
      background: rgba(34, 197, 94, 0.05);
    }
    .step-ans-input.state-wrong {
      border-color: var(--danger) !important;
      color: var(--danger) !important;
      background: rgba(239, 68, 68, 0.05);
    }
    .step-ans-input.state-warning {
      border-color: var(--warning) !important;
      color: var(--warning) !important;
      background: rgba(245, 158, 11, 0.05);
    }
    .step-ans-input.state-revealed {
      border-color: var(--border) !important;
      color: var(--text-dim) !important;
      font-style: italic;
    }

    .shake-trigger {
      animation: shake 0.35s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }

    .solution-body {
      padding: 0.85rem 1rem 1rem;
      border-top: 1px solid var(--border-subtle);
      display: none;
      flex-direction: column;
      gap: 0.6rem;
      background: #17181a;
    }
    .solution-item.open .solution-body { display: flex; }
    .solution-text { font-size: 0.925rem; color: var(--text-muted); line-height: 1.6; }
    .solution-math-display {
      padding: 0.75rem 1rem;
      background: var(--bg);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      overflow-x: auto;
      text-align: left;
    }
    
    /* EXAM DISTRACTOR CHECK BANNER */
    .distractor-banner {
      background: rgba(16, 185, 129, 0.07);
      border: 1px solid rgba(16, 185, 129, 0.28);
      border-radius: 6px;
      padding: 0.85rem 1.1rem;
      font-size: 0.85rem;
      color: #a7f3d0;
      line-height: 1.5;
      display: none;
      margin-top: 0.5rem;
    }

    /* BOTTOM GENERATE BUTTON */
    .problem-footer-actions {
      display: flex;
      justify-content: flex-end;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      margin-top: 0.5rem;
    }
    .btn-generate-next {
      background: #25272c;
      border: 1px solid #3b3e45;
      padding: 0.5rem 1.1rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-generate-next:hover { background: #33363d; border-color: #4b505a; }

    .interactive-var {
      display: inline-block;
      cursor: pointer;
      border-bottom: 1px dotted var(--text-dim);
      padding: 0 1px;
    }
    .interactive-var:hover {
      color: var(--accent-math) !important;
      border-bottom: 1px solid var(--accent-math);
    }

    #tooltip {
      position: fixed;
      background: #1e1f23;
      border: 1px solid #373a40;
      border-radius: 4px;
      padding: 0.5rem 0.75rem;
      font-size: 0.75rem;
      max-width: 320px;
      z-index: 1000;
      pointer-events: none;
      display: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    #tooltip .tt-name { font-weight: 600; color: #fff; margin-bottom: 0.2rem; }
    #tooltip .tt-math { margin: 0.25rem 0; color: var(--accent-math); }
    #tooltip .tt-hint { font-size: 0.68rem; color: var(--text-dim); }

    .carousel-container { max-width: 480px; margin: 1.5rem auto; display: flex; flex-direction: column; gap: 1rem; }
    .carousel-top-bar { display: flex; justify-content: space-between; align-items: center; }
    .carousel-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; display: flex; flex-direction: column; min-height: 320px; }
    .carousel-card-header { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border-subtle); display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-dim); }
    .carousel-card-body { flex: 1; padding: 2rem 1.5rem; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 1.25rem; }
    .carousel-formula { font-size: 1.4rem; padding: 0.75rem 1.25rem; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; width: 100%; overflow-x: auto; }
    .carousel-notes { font-size: 0.85rem; color: var(--text-muted); }
    .carousel-linked-vars { display: flex; align-items: center; gap: 0.4rem; font-size: 0.78rem; color: var(--text-dim); flex-wrap: wrap; justify-content: center; }
    .carousel-footer { padding: 0.75rem 1rem; border-top: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; }
    .carousel-nav-btn { background: transparent; border: 1px solid var(--border); color: var(--text); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; }
    .carousel-dots { display: flex; gap: 0.3rem; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); }
    .dot.active { background: #fff; width: 14px; border-radius: 3px; }

    @media (max-width: 768px) {
      body {
        height: 100dvh;
        overflow-y: auto;
      }
      header {
        padding: 0.6rem 1rem;
        flex-direction: column;
        gap: 0.5rem;
        align-items: stretch;
      }
      header h1 {
        text-align: center;
        font-size: 0.9rem;
      }
      .header-actions {
        justify-content: center;
        flex-wrap: wrap;
        gap: 0.35rem;
      }
      .workspace {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        overflow: visible;
      }
      aside {
        max-height: 220px;
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding: 1rem;
      }
      main {
        padding: 1.5rem 1rem 3rem;
        overflow-y: visible;
      }
      .article-container {
        gap: 1.25rem;
      }
      .step-ans-input {
        width: 120px;
        font-size: 16px;
        padding: 0.4rem 0.6rem;
      }
      .solution-summary {
        padding: 0.6rem 0.75rem;
        gap: 0.5rem;
      }
      .carousel-container {
        margin: 0.5rem auto;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Spur Gear Reviewer & Graph Solver</h1>
    <div class="header-actions">
      <button class="btn" onclick="exportMasteryFile()">💾 Export Mastery</button>
      <button class="btn" onclick="triggerImportMastery()">📥 Import Mastery</button>
      <input type="file" id="mastery-file-input" style="display: none" accept=".json" onchange="handleMasteryImport(event)">
      <button class="btn" onclick="openFolderPicker()">📁 Link Folder</button>
    </div>
  </header>

  <div class="workspace">
    <aside>
      <div class="sidebar-section">
        <span class="sidebar-title">Formula Mastery (Harmonic Spaced)</span>
        <div class="weight-bars" id="weight-bars-el"></div>
      </div>
    </aside>

    <main>
      <!-- PROBLEM VIEW -->
      <section id="view-problem" class="panel-view active">
        <div class="article-container">
          <div class="problem-header">
            <h2 id="p-title"></h2>
            <div id="p-statement" class="problem-statement"></div>
          </div>

          <div class="solution-section">
            <div class="solution-top">
              <span class="solution-title">Solution Steps (Type Answer & Enter)</span>
              <button class="solution-toggle-all" id="btn-toggle-all" onclick="toggleAllSolutions()">Expand / Collapse All</button>
            </div>
            <div id="p-solution-flow" style="display: flex; flex-direction: column; gap: 0.5rem;"></div>
          </div>

          <!-- DISTRACTOR CHECK BANNER -->
          <div id="distractor-banner" class="distractor-banner"></div>

          <!-- GENERATE BUTTON ON THE BOTTOM RIGHT -->
          <div class="problem-footer-actions">
            <button class="btn-generate-next" onclick="generateGraphProblem()">⚡ Generate Next Problem</button>
          </div>
        </div>
      </section>

      <!-- CAROUSEL VIEW -->
      <section id="view-carousel" class="panel-view">
        <div class="carousel-container">
          <div class="carousel-top-bar">
            <button class="btn" onclick="backToProblem()">← Back to Problem</button>
            <span id="c-var-title" style="font-size: 0.9rem; font-weight: 500;"></span>
          </div>

          <div class="carousel-card">
            <div class="carousel-card-header">
              <span id="c-counter">1 / 1</span>
              <span id="c-unit"></span>
            </div>

            <div class="carousel-card-body">
              <div id="c-formula" class="carousel-formula"></div>
              <p id="c-notes" class="carousel-notes"></p>

              <div class="carousel-linked-vars">
                <span>Variables:</span>
                <div id="c-linked-container" style="display: inline-flex; gap: 0.4rem; flex-wrap: wrap;"></div>
              </div>
            </div>

            <div class="carousel-footer">
              <button class="carousel-nav-btn" id="c-prev" onclick="prevCard()">‹</button>
              <div class="carousel-dots" id="c-dots"></div>
              <button class="carousel-nav-btn" id="c-next" onclick="nextCard()">›</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="tooltip"></div>

  <!-- SCRIPTS IN SAME FOLDER -->
  <script src="units.js"></script>
  <script src="gear_graph.js"></script>
  <script src="app.js"></script>
</body>
</html>
