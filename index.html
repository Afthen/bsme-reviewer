<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spur Gear Reviewer & Graph Solver</title>
  
  <!-- Math & Symbolic Dependencies (KaTeX) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <!-- Client-Side Computer Algebra System (Nerdamer CAS) -->
  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/nerdamer.core.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Algebra.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Calculus.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Solve.js"></script>

  <style>
    :root {
      --bg: #141517;
      --panel: #1a1b1e;
      --card: #202124;
      --border: #2e3035;
      --border-subtle: #25262a;
      --text: #e4e5e7;
      --text-muted: #909296;
      --text-dim: #606266;
      --accent-math: #93c5fd;
      --accent-glow: rgba(147, 197, 253, 0.35);
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      min-height: 100dvh;
      overflow: hidden;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      gap: 0.75rem;
      z-index: 20;
    }
    header h1 { font-size: 0.95rem; font-weight: 600; color: var(--text); }
    .header-actions { display: flex; gap: 0.4rem; align-items: center; }
    .btn {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.35rem 0.65rem;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn:hover { background: var(--border); color: #fff; }
    
    .workspace {
      display: block;
      flex: 1;
      overflow-y: auto;
      position: relative;
      height: calc(100vh - 48px);
      height: calc(100dvh - 48px);
    }

    /* SLIDE-OUT MASTERY DRAWER */
    aside {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 320px;
      max-width: 85vw;
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 1.25rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      overflow-y: auto;
      z-index: 1001;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      box-shadow: 4px 0 24px rgba(0, 0, 0, 0.5);
    }
    aside.open { transform: translateX(0); }

    #sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(2px);
      z-index: 1000;
      display: none;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    #sidebar-overlay.active { display: block; opacity: 1; }

    .sidebar-section { display: flex; flex-direction: column; gap: 0.5rem; }
    .sidebar-title { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; color: var(--text-dim); }
    .weight-bars { display: flex; flex-direction: column; gap: 0.35rem; font-size: 0.72rem; color: var(--text-muted); }
    .weight-row { display: flex; flex-direction: column; gap: 0.2rem; }
    .weight-label-bar { display: flex; justify-content: space-between; gap: 0.5rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; align-items: center; }
    
    /* MAIN PANELS */
    main { width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; }
    .panel-view { display: none; width: 100%; height: 100%; }
    .panel-view.active { display: block; }

    /* VIEW 1: PROBLEM VIEW */
    #view-problem {
      padding: 2.25rem 1.5rem 3rem;
      overflow-y: auto;
    }
    .article-container { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.75rem; }
    
    .problem-header h2 { font-size: 1.35rem; font-weight: 600; margin-bottom: 0.75rem; color: #fff; }
    .problem-statement { font-size: 1rem; color: #d1d2d5; line-height: 1.7; }
    
    .solution-section { border-top: 1px solid var(--border); padding-top: 1.5rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .solution-top { display: flex; justify-content: space-between; align-items: center; min-height: 24px; }
    .solution-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; color: var(--text-dim); }
    .solution-toggle-all { font-size: 0.75rem; color: var(--text-muted); cursor: pointer; background: none; border: none; display: none; }
    .solution-toggle-all:hover { color: var(--text); }
    
    .solution-item { border: 1px solid var(--border-subtle); border-radius: 4px; background: var(--panel); overflow: hidden; }
    .solution-summary {
      padding: 0.6rem 0.9rem;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
      gap: 1rem;
    }
    .solution-summary:hover { background: var(--card); }
    .step-label-wrap { display: flex; align-items: center; gap: 0.6rem; flex: 1; }
    .chevron { font-size: 0.75rem; color: var(--text-dim); transition: transform 0.2s ease; }
    .solution-item.open .chevron { transform: rotate(90deg); color: var(--text); }
    
    .step-input-wrap { display: flex; align-items: center; padding: 2px; }
    .step-ans-input {
      background: #141517;
      border: 1.5px solid var(--border);
      color: #fff;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0.35rem 0.8rem;
      border-radius: 5px;
      width: 140px;
      outline: none;
      transition: all 0.15s;
      text-align: right;
      -webkit-appearance: none;
      appearance: none;
    }
    .step-ans-input::-webkit-outer-spin-button,
    .step-ans-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .step-ans-input:focus { border-color: var(--accent-math); }
    .step-ans-input.state-correct {
      border-color: var(--success) !important;
      color: var(--success) !important;
      background: rgba(34, 197, 94, 0.05);
    }
    .step-ans-input.state-wrong {
      border-color: var(--danger) !important;
      color: var(--danger) !important;
      background: rgba(239, 68, 68, 0.05);
    }
    .step-ans-input.state-warning {
      border-color: var(--warning) !important;
      color: var(--warning) !important;
      background: rgba(245, 158, 11, 0.05);
    }
    .step-ans-input.state-revealed {
      border-color: var(--border) !important;
      color: var(--text-dim) !important;
      font-style: italic;
    }

    .shake-trigger { animation: shake 0.35s ease; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }

    .solution-body {
      padding: 0.85rem 1rem 1rem;
      border-top: 1px solid var(--border-subtle);
      display: none;
      flex-direction: column;
      gap: 0.6rem;
      background: #17181a;
    }
    .solution-item.open .solution-body { display: flex; }
    .solution-text { font-size: 0.925rem; color: var(--text-muted); line-height: 1.6; }
    .solution-math-display {
      padding: 0.75rem 1rem;
      background: var(--bg);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      overflow-x: auto;
      text-align: left;
    }
    
    .distractor-banner {
      background: rgba(16, 185, 129, 0.07);
      border: 1px solid rgba(16, 185, 129, 0.28);
      border-radius: 6px;
      padding: 0.85rem 1.1rem;
      font-size: 0.85rem;
      color: #a7f3d0;
      line-height: 1.5;
      display: none;
      margin-top: 0.5rem;
    }

    .problem-footer-actions {
      display: flex;
      justify-content: flex-end;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      margin-top: 0.5rem;
    }
    .btn-generate-next {
      background: #25272c;
      border: 1px solid #3b3e45;
      padding: 0.5rem 1.1rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-generate-next:hover { background: #33363d; border-color: #4b505a; }

    .interactive-var {
      display: inline-block;
      cursor: pointer;
      border-bottom: 1px dotted var(--text-dim);
      padding: 0 1px;
    }
    .interactive-var:hover {
      color: var(--accent-math) !important;
      border-bottom: 1px solid var(--accent-math);
    }

    #tooltip {
      position: fixed;
      background: #1e1f23;
      border: 1px solid #373a40;
      border-radius: 4px;
      padding: 0.5rem 0.75rem;
      font-size: 0.75rem;
      max-width: 320px;
      z-index: 1000;
      pointer-events: none;
      display: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    #tooltip .tt-name { font-weight: 600; color: #fff; margin-bottom: 0.2rem; }
    #tooltip .tt-math { margin: 0.25rem 0; color: var(--accent-math); }
    #tooltip .tt-hint { font-size: 0.68rem; color: var(--text-dim); }

    /* VIEW 2: GRAPH VISUALIZER & CAROUSEL OVERLAY VIEW */
    #view-carousel {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f1012;
    }

    /* TOP NAVIGATION HUD */
    .graph-top-bar {
      position: absolute;
      top: 1rem;
      left: 1.25rem;
      right: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
      pointer-events: none;
    }
    .graph-top-bar > * { pointer-events: auto; }
    
    .graph-title-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(26, 27, 30, 0.88);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.35rem 0.9rem;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }
    .graph-node-title { font-size: 0.875rem; font-weight: 600; color: #fff; }
    .graph-node-unit { color: var(--accent-math); font-size: 0.75rem; font-weight: 500; }

    /* LAYER 0: BACKGROUND INTERACTIVE SVG GRAPH */
    .graph-viewport {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: grab;
      user-select: none;
      touch-action: none;
      z-index: 1;
    }
    .graph-viewport:active { cursor: grabbing; }
    .graph-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* SVG GRAPH STYLES */
    .graph-cluster-bg {
      fill: rgba(32, 33, 36, 0.28);
      stroke: rgba(46, 48, 53, 0.45);
      stroke-dasharray: 4, 4;
      rx: 16;
      ry: 16;
    }
    .graph-cluster-label {
      fill: #4b4e56;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      user-select: none;
    }
    .graph-edge {
      stroke: #26282d;
      stroke-width: 1.5;
      stroke-linecap: round;
      transition: stroke 0.2s ease, stroke-width 0.2s ease, opacity 0.2s ease;
    }
    .graph-edge.active {
      stroke: var(--accent-math);
      stroke-width: 2.75;
      filter: drop-shadow(0 0 4px var(--accent-glow));
    }
    .graph-node {
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .graph-node circle {
      fill: #1a1b1e;
      stroke: #33363d;
      stroke-width: 2;
      transition: all 0.2s ease;
    }
    .graph-node:hover circle {
      stroke: var(--accent-math);
      fill: #222630;
      filter: drop-shadow(0 0 6px var(--accent-glow));
    }
    .graph-node.selected circle {
      stroke: #60a5fa;
      stroke-width: 3.5;
      fill: #1e293b;
      filter: drop-shadow(0 0 10px rgba(96, 165, 250, 0.75));
    }
    .graph-node.neighbor circle {
      stroke: #93c5fd;
      stroke-width: 2.2;
      fill: #182230;
    }
    .graph-node.dimmed { opacity: 0.2; }
    .graph-node text {
      fill: #e4e5e7;
      font-size: 11.5px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
      user-select: none;
    }
    .graph-node.selected text { fill: #fff; font-weight: 700; }

    /* LAYER 1: FOREGROUND FLOATING CAROUSEL DOCK */
    .carousel-dock {
      position: absolute;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 520px;
      z-index: 25;
      pointer-events: none;
    }
    .carousel-dock .carousel-card {
      pointer-events: auto;
      background: rgba(26, 27, 30, 0.94);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.88), 0 0 1px rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      max-height: 44vh;
      overflow: hidden;
      min-height: unset;
    }
    .carousel-card-header {
      padding: 0.6rem 0.9rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-dim);
    }
    .carousel-card-body {
      flex: 1;
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 0.75rem;
      overflow-y: auto;
    }
    .carousel-formula {
      font-size: 1.25rem;
      padding: 0.6rem 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 100%;
      overflow-x: auto;
    }
    .carousel-notes { font-size: 0.8rem; color: var(--text-muted); line-height: 1.4; }
    .carousel-linked-vars {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      color: var(--text-dim);
      flex-wrap: wrap;
      justify-content: center;
    }
    .carousel-footer {
      padding: 0.5rem 0.9rem;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .carousel-nav-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
    }
    .carousel-dots { display: flex; gap: 0.3rem; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); }
    .dot.active { background: #fff; width: 14px; border-radius: 3px; }

    /* CANONICAL VS ISOLATED TOGGLE SWITCH */
    .formula-toggle-wrap {
      display: inline-flex;
      background: #141517;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2px;
      gap: 2px;
    }
    .toggle-pill {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.18rem 0.55rem;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .toggle-pill.active {
      background: #252830;
      color: var(--accent-math);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
    }

    /* RESPONSIVE ADAPTATION */
    @media (max-width: 768px) {
      header {
        padding: 0.5rem 0.75rem;
        flex-direction: column;
        gap: 0.5rem;
        align-items: stretch;
      }
      .header-actions {
        justify-content: center;
        flex-wrap: wrap;
        gap: 0.35rem;
      }
      #view-problem {
        padding: 1.25rem 0.75rem 3rem;
      }
      .step-ans-input {
        width: 120px;
        font-size: 16px; /* Prevents auto-zoom in iOS Safari */
        padding: 0.4rem 0.6rem;
      }
      .solution-summary {
        padding: 0.6rem 0.75rem;
        gap: 0.5rem;
      }
      .graph-top-bar {
        top: 0.5rem;
        left: 0.6rem;
        right: 0.6rem;
      }
      .graph-title-wrap {
        font-size: 0.75rem;
        padding: 0.25rem 0.6rem;
      }
      .carousel-dock {
        bottom: 0.6rem;
        width: 95%;
      }
      .carousel-dock .carousel-card {
        max-height: 48vh;
      }
      .carousel-card-body {
        padding: 0.6rem 0.8rem;
        gap: 0.4rem;
      }
      .carousel-formula {
        font-size: 1rem;
        padding: 0.45rem 0.6rem;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER WITH HAMBURGER BUTTON -->
  <header>
    <div style="display: flex; align-items: center; gap: 0.6rem;">
      <button class="btn" id="btn-hamburger" onclick="toggleSidebar()">☰ Mastery</button>
      <h1>Spur Gear Reviewer</h1>
    </div>
    <div class="header-actions">
      <button class="btn" onclick="exportMasteryFile()">💾 Export</button>
      <button class="btn" onclick="triggerImportMastery()">📥 Import</button>
      <input type="file" id="mastery-file-input" style="display: none" accept=".json" onchange="handleMasteryImport(event)">
      <button class="btn" onclick="openFolderPicker()">📁 Link Folder</button>
    </div>
  </header>

  <!-- BACKDROP OVERLAY FOR CLOSING DRAWER -->
  <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

  <div class="workspace">
    <!-- SLIDING ASIDE DRAWER -->
    <aside>
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span class="sidebar-title">Formula Mastery (Harmonic)</span>
        <button class="btn" style="padding: 0.2rem 0.5rem;" onclick="toggleSidebar()">✕</button>
      </div>
      <div class="sidebar-section">
        <div class="weight-bars" id="weight-bars-el"></div>
      </div>
    </aside>

    <main>
      <!-- VIEW 1: PROBLEM VIEW -->
      <section id="view-problem" class="panel-view active">
        <div class="article-container">
          <div class="problem-header">
            <h2 id="p-title"></h2>
            <div id="p-statement" class="problem-statement"></div>
          </div>

          <div class="solution-section">
            <div class="solution-top">
              <span class="solution-title">Solution Steps (Type Answer & Enter)</span>
              <button class="solution-toggle-all" id="btn-toggle-all" onclick="toggleAllSolutions()">Expand / Collapse All</button>
            </div>
            <div id="p-solution-flow" style="display: flex; flex-direction: column; gap: 0.5rem;"></div>
          </div>

          <!-- DISTRACTOR CHECK BANNER -->
          <div id="distractor-banner" class="distractor-banner"></div>

          <!-- GENERATE BUTTON ON THE BOTTOM RIGHT -->
          <div class="problem-footer-actions">
            <button class="btn-generate-next" onclick="generateGraphProblem()">⚡ Generate Next Problem</button>
          </div>
        </div>
      </section>

      <!-- VIEW 2: GRAPH VISUALIZER & DOCKED CAROUSEL VIEW -->
      <section id="view-carousel" class="panel-view">
        <!-- TOP NAVIGATION HUD -->
        <div class="graph-top-bar">
          <button class="btn" onclick="backToProblem()">← Back to Problem</button>
          <div class="graph-title-wrap">
            <span id="c-var-title" class="graph-node-title"></span>
            <span id="c-unit" class="graph-node-unit"></span>
          </div>
          <button class="btn" onclick="recenterActiveNode()">⌖ Center</button>
        </div>

        <!-- LAYER 0: BACKGROUND INTERACTIVE SVG GRAPH -->
        <div id="graph-viewport" class="graph-viewport">
          <svg id="graph-svg" class="graph-svg"></svg>
        </div>

        <!-- LAYER 1: FOREGROUND FLOATING CAROUSEL DOCK -->
        <div class="carousel-dock">
          <div class="carousel-card">
            <div class="carousel-card-header">
              <span id="c-counter">1 / 1</span>
              <!-- FORMULA TOGGLE: CANONICAL VS ISOLATED -->
              <div class="formula-toggle-wrap">
                <button id="toggle-canonical" class="toggle-pill active" onclick="setFormulaViewMode('canonical')">Canonical</button>
                <button id="toggle-isolated" class="toggle-pill" onclick="setFormulaViewMode('isolated')">Isolated</button>
              </div>
            </div>

            <div class="carousel-card-body">
              <div id="c-formula" class="carousel-formula"></div>
              <p id="c-notes" class="carousel-notes"></p>

              <div class="carousel-linked-vars">
                <span>Connected Variables:</span>
                <div id="c-linked-container" style="display: inline-flex; gap: 0.4rem; flex-wrap: wrap;"></div>
              </div>
            </div>

            <div class="carousel-footer">
              <button class="carousel-nav-btn" id="c-prev" onclick="prevCard()">‹</button>
              <div class="carousel-dots" id="c-dots"></div>
              <button class="carousel-nav-btn" id="c-next" onclick="nextCard()">›</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="tooltip"></div>
