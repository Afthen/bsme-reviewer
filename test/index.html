<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topic Verification Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --pass: #22c55e;
      --fail: #ef4444;
    }
    body {
      margin: 0;
      padding: 2rem;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      max-width: 900px;
      margin: 0 auto 2rem auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }
    h1 { margin: 0; font-size: 1.5rem; font-weight: 600; }
    .btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
    }
    .btn:hover { background: var(--border); }
    .dashboard {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .topic-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
    }
    .topic-card.pass { border-left: 4px solid var(--pass); }
    .topic-card.fail { border-left: 4px solid var(--fail); }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .title { font-size: 1.25rem; font-weight: 600; }
    .badge {
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge.pass { background: rgba(34, 197, 94, 0.2); color: var(--pass); }
    .badge.fail { background: rgba(239, 68, 68, 0.2); color: var(--fail); }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .stat-box {
      background: rgba(15, 23, 42, 0.6);
      padding: 0.75rem 1rem;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .stat-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.25rem; }
    .stat-value { font-size: 1.125rem; font-weight: 600; font-family: monospace; }
    .error-list {
      background: #000;
      border-radius: 6px;
      padding: 1rem;
      font-family: monospace;
      font-size: 0.8rem;
      color: #f87171;
      max-height: 250px;
      overflow-y: auto;
      margin-top: 1rem;
    }
    .error-item { margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Topic Verification Dashboard</h1>
    <button class="btn" onclick="runAll()">Rerun Tests</button>
  </div>
  <div class="dashboard" id="results">
    <div style="color: var(--text-muted);">Initializing test suite...</div>
  </div>

  <script type="module">
    import { ALL_TOPICS } from "../src/topics/index.js";
    import { validateTopic } from "./validator.js";

    window.runAll = function() {
      const container = document.getElementById("results");
      container.innerHTML = "";

      ALL_TOPICS.forEach(topic => {
        const report = validateTopic(topic);
        const isPass = report.errors.length === 0;

        const card = document.createElement("div");
        card.className = `topic-card ${isPass ? 'pass' : 'fail'}`;

        let errorsHtml = "";
        if (!isPass) {
          errorsHtml = `
            <div class="error-list">
              ${report.errors.map(err => `<div class="error-item">✖ ${err}</div>`).join("")}
            </div>
          `;
        }

        card.innerHTML = `
          <div class="card-header">
            <div class="title">${topic.title} <span style="font-size: 0.85rem; color: var(--text-muted); font-weight: normal;">(${topic.id})</span></div>
            <div class="badge ${isPass ? 'pass' : 'fail'}">${isPass ? 'Passed' : 'Failed'}</div>
          </div>
          <div class="stats">
            <div class="stat-box">
              <div class="stat-label">Relations Solved</div>
              <div class="stat-value">${report.passedRelations} / ${report.testedRelations}</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">Variable Pairs Inverted</div>
              <div class="stat-value">${report.passedPairs} / ${report.testedPairs}</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">Status</div>
              <div class="stat-value" style="color: ${isPass ? 'var(--pass)' : 'var(--fail)'};">
                ${isPass ? '0 Errors' : `${report.errors.length} Errors`}
              </div>
            </div>
          </div>
          ${errorsHtml}
        `;
        container.appendChild(card);
      });
    };

    runAll();
  </script>
</body>
</html>
